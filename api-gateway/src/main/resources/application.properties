server.port=8080

spring.application.name=api-gateway

spring.config.import=optional:configserver:http://config-server:8888

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=userServiceCB
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/user-service

resilience4j.circuitbreaker.instances.userServiceCB.sliding-window-size=5
resilience4j.timelimiter.instances.userServiceCB.timeout-duration=3s
resilience4j.circuitbreaker.instances.userServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userServiceCB.failure-rate-threshold=50

eureka.instance.non-secure-port-enabled=true
eureka.instance.hostname=api-gateway
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/